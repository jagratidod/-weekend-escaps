<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo/weekend-escapes-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekend Escapes | Your Next Adventure Awaits</title>
    <meta name="description" content="From majestic mountains to serene valleys, we craft unforgettable travel experiences for every explorer." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var color = localStorage.getItem('we_theme_color');
          var hover = localStorage.getItem('we_theme_hover');
          if (color) {
            var root = document.documentElement;
            root.style.setProperty('--theme-color', color);
            root.style.setProperty('--primary-orange', color);
            if (hover) root.style.setProperty('--theme-hover', hover);
            var clean = color.replace('#', '').trim();
            if (clean.length === 3) clean = clean.split('').map(function(c) { return c + c; }).join('');
            if (clean.length === 6) {
              var r = parseInt(clean.substring(0, 2), 16);
              var g = parseInt(clean.substring(2, 4), 16);
              var b = parseInt(clean.substring(4, 6), 16);
              if (!isNaN(r) && !isNaN(g) && !isNaN(b)) {
                root.style.setProperty('--theme-rgb', r + ', ' + g + ', ' + b);
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F7F5] text-[#111111] font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
