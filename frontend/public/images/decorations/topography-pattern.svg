<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 260" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="topoFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="260" fill="url(#topoFade)"/>
  
  <!-- Topographic Contour Lines -->
  <g fill="none" stroke="#FF6B16" stroke-width="1.2" stroke-opacity="0.14">
    <path d="M-50,60 Q200,120 450,40 T950,90 T1450,30 T1600,80"/>
    <path d="M-50,90 Q220,150 480,70 T980,120 T1480,60 T1600,110"/>
    <path d="M-50,120 Q240,180 510,100 T1010,150 T1510,90 T1600,140"/>
    <path d="M-50,150 Q260,210 540,130 T1040,180 T1540,120 T1600,170"/>
    <path d="M-50,180 Q280,240 570,160 T1070,210 T1570,150 T1600,200"/>
    <path d="M-50,210 Q300,270 600,190 T1100,240 T1600,180"/>
    
    <!-- Topographic Hill Rings on Left -->
    <ellipse cx="140" cy="180" rx="90" ry="40"/>
    <ellipse cx="140" cy="180" rx="60" ry="25"/>
    <ellipse cx="140" cy="180" rx="30" ry="12"/>

    <!-- Topographic Hill Rings on Right -->
    <ellipse cx="1280" cy="190" rx="110" ry="45"/>
    <ellipse cx="1280" cy="190" rx="75" ry="30"/>
    <ellipse cx="1280" cy="190" rx="40" ry="15"/>
